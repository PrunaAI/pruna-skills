name: default

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify skill layout
        run: make verify

      - name: Validate release
        run: ./.maintainer/validate_release.sh --skip-verify
