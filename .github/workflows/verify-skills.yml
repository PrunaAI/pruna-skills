name: Verify skills

on:
  pull_request:
    paths:
      - "skills/**"
      - ".maintainer/**"
      - "VERSION"
      - "skills.sh.json"
      - ".claude-plugin/**"
      - "Makefile"
      - ".github/workflows/verify-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".maintainer/**"
      - "VERSION"
      - "skills.sh.json"
      - ".claude-plugin/**"
      - "Makefile"
      - ".github/workflows/verify-skills.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify skill layout
        run: make verify

      - name: Validate release
        run: ./.maintainer/validate_release.sh --skip-verify
