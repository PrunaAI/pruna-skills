name: Verify skills

on:
  pull_request:
    paths:
      - "skills/**"
      - ".maintainer/**"
      - "VERSION"
      - "skills.sh.json"
      - ".claude-plugin/**"
      - "Makefile"
      - ".github/workflows/verify-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".maintainer/**"
      - "VERSION"
      - "skills.sh.json"
      - ".claude-plugin/**"
      - "Makefile"
      - ".github/workflows/verify-skills.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Verify skill layout
        run: make verify

      - name: Validate release
        run: ./.maintainer/validate_release.sh --skip-verify
