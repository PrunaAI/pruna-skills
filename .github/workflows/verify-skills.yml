name: Verify skills

on:
  pull_request:
    paths:
      - "tools/**"
      - "workflows/**"
      - "references/**"
      - ".maintainer/**"
      - "VERSION"
      - "skills.sh.json"
      - "plugins/**"
      - ".claude-plugin/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release
        run: ./.maintainer/validate_release.sh
