name: Publish skills

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Targets (clawhub,clawhub-plugins,index,github,npx)"
        default: "clawhub,clawhub-plugins,index"
      skill:
        description: "Optional single skill name (blank = all)"
        required: false
        default: ""
  push:
    tags:
      - "skills-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify bundles
        run: ./scripts/verify_skill_bundles.sh

      - name: Create GitHub Release from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/skills-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#skills-v}"
          ./scripts/create_github_release.sh "${VERSION}"

      - name: Publish to registries
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_OWNER: ${{ vars.CLAWHUB_OWNER }}
        run: |
          TARGET="${{ github.event.inputs.target }}"
          [[ -z "${TARGET}" ]] && TARGET="clawhub,clawhub-plugins,index"
          ARGS=(--execute --target "${TARGET}")
          SKILL="${{ github.event.inputs.skill }}"
          [[ -n "${SKILL}" ]] && ARGS+=(--skill "${SKILL}")
          python3 scripts/publish_all_skills.py "${ARGS[@]}"
