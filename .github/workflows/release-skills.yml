name: Release skills

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver (e.g. 0.0.3)"
        required: true
      dry_run:
        description: "Dry run only (no commit/publish)"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set version and bundle
        run: |
          echo "${{ github.event.inputs.version }}" > VERSION
          python3 scripts/sync_skill_versions.py
          ./scripts/bundle_all_skills.sh

      - name: Verify and validate
        run: |
          ./scripts/verify_skill_bundles.sh
          python3 scripts/write_skills_sh_json.py --check
          python3 scripts/validate_all_skills.py

      - name: Commit release artifacts
        if: github.event.inputs.dry_run == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION tools/ guides/ workflows/ plugins/ .claude-plugin/ skills.sh.json README.skills.md
          git diff --staged --quiet || git commit -m "[release] skills v${{ github.event.inputs.version }}"
          git tag "skills-v${{ github.event.inputs.version }}" || true
          git push origin HEAD
          git push origin "skills-v${{ github.event.inputs.version }}"

      - name: Publish to ClawHub
        if: github.event.inputs.dry_run == 'false'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_OWNER: ${{ vars.CLAWHUB_OWNER }}
        run: python3 scripts/publish_all_skills.py --execute --target clawhub,clawhub-plugins,index
